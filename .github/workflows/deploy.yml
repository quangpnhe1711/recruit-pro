name: Deploy Backend

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy backend to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: GH_TOKEN
          script: |
            set -e

            echo "================================="
            echo "📦 Pull latest backend code"
            echo "================================="
            cd /opt/recruitpro/recruit-pro
            # VPS remote is HTTPS with no stored credentials; authenticate this
            # fetch with the workflow's short-lived token instead of the remote.
            git fetch "https://x-access-token:${GH_TOKEN}@github.com/quangpnhe1711/recruit-pro.git" develop
            git reset --hard FETCH_HEAD
            git clean -fd

            echo "================================="
            echo "🧹 Reset database (schema + seed)"
            echo "================================="
            bash /opt/recruitpro/reset.sh

            echo "================================="
            echo "🚀 Build & restart backend"
            echo "================================="
            docker compose up -d --build backend

            echo "================================="
            echo "📊 Container status"
            echo "================================="
            docker ps