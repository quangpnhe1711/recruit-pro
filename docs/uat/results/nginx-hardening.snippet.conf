# RecruitPro — nginx hardening for BUG-UAT-004 (security headers / server_tokens) and BUG-UAT-013 (OData).
# NOT deployed by CI (CI only rebuilds the backend container). Apply manually on the VPS:
#
#   sudo nano /etc/nginx/sites-available/recruitpro     # add the block below inside the `server { listen 443 ssl; }` server
#   sudo nginx -t                                        # MUST pass before reloading
#   sudo systemctl reload nginx                          # graceful, no downtime
#
# Rollback: remove the added lines, `nginx -t`, `systemctl reload nginx`.
# ---------------------------------------------------------------------------------------------------

# ---- BUG-UAT-004: security headers + hide server version ----
# Put these inside the HTTPS `server { ... }` block (the one with `listen 443 ssl;`), at server scope
# (NOT inside a location — nginx add_header does not inherit into a location that has its own add_header).
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP tuned to the deployed SPA (Google Fonts are used by index.html). If a screen breaks, widen the
    # offending directive rather than removing CSP. `frame-ancestors 'none'` also covers clickjacking.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# ---- BUG-UAT-013: make OData reachable (only if the API actually maps /odata on :5000) ----
# Verify first on the VPS:  curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:5000/odata/Jobs
# If that returns 200/4xx (i.e. the API serves it), add this location so the edge proxies it like /api/:
    location /odata/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

# ---- (Optional) SSE realtime: disable proxy buffering for the notifications stream ----
# Not a UAT defect, but recommended so Server-Sent Events flush promptly through nginx:
    location /api/notifications/stream {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
