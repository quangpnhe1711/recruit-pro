name: Deploy Backend

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "================================="
            echo "📦 Pull latest backend code"
            echo "================================="
            cd /opt/recruitpro/recruit-pro
            git pull

            echo "================================="
            echo "🧹 Reset database (schema + seed)"
            echo "================================="
            bash /opt/recruitpro/reset.sh

            echo "================================="
            echo "🚀 Build & restart backend"
            echo "================================="
            docker compose up -d --build backend

            echo "================================="
            echo "📊 Container status"
            echo "================================="
            docker ps